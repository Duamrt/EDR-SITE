<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#004704">
  <meta name="robots" content="noindex">
  <meta name="application-name" content="EDR Esquadro">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Esquadro">
  <meta name="versao" content="1.1.0">
  <title>EDR Esquadro</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preload" href="fontes/archivo-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="estilo.css?v=1.1.0">
</head>
<body>
  <header class="topo">
    <button class="voltar" id="voltar" type="button" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="marca">
      <span class="selo" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M7 25V7h18" fill="none" stroke="currentColor" stroke-width="3.2"/><path d="M7 25 25 7" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.6 2.6"/><rect x="7" y="19" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span>
      <div><b>EDR Esquadro</b><small id="subtitulo">Locação por eixos</small></div>
    </div>
    <span class="piloto" title="Ainda não validado no teste de campo 8 × 4 m">Piloto</span>
  </header>

  <main id="tela" aria-live="polite"></main>

  <footer class="rodape">
    <span>EDR Engenharia • v1.1 piloto em teste</span>
    <button id="ver-registro" class="link" type="button">Registro</button>
  </footer>

  <dialog id="registro" class="dialogo">
    <div class="dialogo-topo"><h2>Registro das conferências</h2><button class="fechar" type="button" data-fechar aria-label="Fechar">×</button></div>
    <div id="registro-lista"></div>
    <div class="dialogo-acoes"><button id="copiar-registro" class="botao" type="button">Copiar para o WhatsApp</button><button id="limpar-registro" class="botao discreto" type="button">Limpar</button></div>
  </dialog>

  <script src="geometria.js?v=1.1.0"></script>
  <script src="app.js?v=1.1.0"></script>
</body>
</html>
