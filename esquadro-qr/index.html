<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>EDR Esquadro</title>
  <meta http-equiv="refresh" content="2;url=/esquadro/">
  <style>body{margin:0;font:17px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;background:#fff;color:#1a1c1b;padding:16px;text-align:center}a{color:#004704;font-weight:700}</style>
</head>
<body>
  <p>O Esquadro QR foi substituído pela versão nova.<br><a href="/esquadro/">Abrir o EDR Esquadro</a></p>
  <script>
    // limpa o app antigo deste endereço (cache offline) e segue para a versão nova
    (async () => {
      try {
        const regs = await navigator.serviceWorker?.getRegistrations?.() || [];
        await Promise.all(regs.filter((r) => r.scope.includes('/esquadro-qr/')).map((r) => r.unregister()));
        const ks = await caches?.keys?.() || [];
        await Promise.all(ks.filter((k) => /esquadro-qr/i.test(k)).map((k) => caches.delete(k)));
      } catch (_) {}
      location.replace('/esquadro/');
    })();
  </script>
</body>
</html>
